name: Zonderq UI - Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instaluj SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Testy i budowa APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: ZonderqUI-0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
